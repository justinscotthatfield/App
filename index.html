<html lang="en">

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="apple-mobile-web-app-capable" content="yes">

  <link rel="apple-touch-icon" href="data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAMAAAADACAYAAABS3GwHAAAACXBIWXMAAAsTAAALEwEAmpwYAAADaElEQVR4nO3dMU4DMRCF4TkhB+AAnIIb0FJxCxpugBRRQEtFRUdJQUFBR0tHQ0MDBQfgAByBc/AkS0iwLGY9M/bn75NGSrEd7+zYXq+9EwAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAMCwdqUdYN/OZftSuw9mP+MeZkP6Xlvb2r1o9yPuY7ao77W1G92L+l7ivmaL+F5b23evRXyP7ms2u++1td33WsT32H3N5va9tta+1yK+x+5rNrfvtbX2vRbxPXZfs7l9r6217rWI77H7ms3te22tda9FfI/d12xu32trrXst4nvsvmZz+15ba91rEd9j9zWb2/faWutei/geu6/Z3L7X1lr3WsT32H3N5va9tta61yK+x+5rNrfvtbXWvRbxPXZfs7l9r6217rWI77H7ms3te22tda9FfI/d12xu32trrXst4nvsvmZz+15ba91rEd9j9zWb2/faWutei/geu6/Z3L7X1lr3WsT32H3N5va9tta61yK+x+5rNrfvtbXWvRbxPXZfs7l9r6217rWI77H7ms3te22tda9FfI/d12xu32trrXst4nvsvmZz+15ba91rEd9j9zWb2/faWutei/geu6/Z3L7X1lr3WsT32H3N5va9tta61yK+x+5rNrfvtbXWvRbxPXZfs7l9r6217rWI77H7ms3te22tda9FfI/d12xu32trrXst4nvsvmZz+15ba91rEd9j9zWb2/faWutei/geu6/Z3L7X1lr3WsT32H3N5va9tta61yK+x+5rNrfvtbXWvRbxPXZfs7l9r6217rWI77H7ms3te22tda9FfI/d12xu32trrXst4nvsvmZz+15ba91rEd9j9zWb2/faWutei/geu6/Z3L7X1lr3WsT32H3N5va9tta61yK+x+5rNrfvtbXWvRbxPXZfs7l9r6217rWI77H7ms3te22tda9FfI/d12xu32trrXst4nvsvmZz+15ba91rEd9j9zWb2/faWutei/geu6/Z3L7X1lr3WsT32H3N5va9tta61yK+x+5rNrfvtbXWvRbxPXZfs7l9r6217rWI77H7ms3te22tda9FfI/d12xu32trrXst4nvsvmZz+15ba91rEd9j9zWb2/faWutei/geu6/Z3L7X1lr3WsT32H3N5va9tta61yK+x+5rNrfvtbXWvRbxPXZfs7l9r6217rWI77H7ms3te22tda9FfI/d12xu32trrXst4nvsvmZz+15ba91rEd9j9zWb2/faWutei/geu6/Z3L7X1lr3WsT32H3N5va9ttYAAAAAAAAAAAAAAAAAAAAAgJ35BRMxzJcfp+oAAAAASUVORK5CYII=">
  
  <script src="https://cdn.tailwindcss.com"></script>
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  
  <style>
    body {
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', sans-serif;
      -webkit-font-smoothing: antialiased;
    }
    .install-prompt {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      background: #2563eb;
      color: white;
      padding: 16px;
      text-align: center;
      z-index: 9999;
    }
    .install-prompt button {
      background: white;
      color: #2563eb;
      border: none;
      padding: 8px 24px;
      border-radius: 8px;
      font-weight: bold;
      margin: 8px;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <div id="install-prompt" class="install-prompt" style="display:none;">
    <p style="margin: 0 0 8px 0; font-size: 14px;">📱 Install this app on your iPhone!</p>
    <p style="margin: 0 0 12px 0; font-size: 12px;">Tap the Share button below, then "Add to Home Screen"</p>
    <button onclick="document.getElementById('install-prompt').style.display='none'">Got it!</button>
  </div>
  
  <div id="root"></div>
  
  <script type="text/babel">
    const { useState, useEffect } = React;
    const Plus = () => <svg width="24" height="24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>;
    const Trash2 = () => <svg width="24" height="24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/><line x1="10" y1="11" x2="10" y2="17"/><line x1="14" y1="11" x2="14" y2="17"/></svg>;
    const Edit2 = () => <svg width="24" height="24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M17 3a2.828 2.828 0 1 1 4 4L7.5 20.5 2 22l1.5-5.5L17 3z"/></svg>;
    const Save = () => <svg width="24" height="24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"/><polyline points="17 21 17 13 7 13 7 21"/><polyline points="7 3 7 8 15 8"/></svg>;
    const X = () => <svg width="24" height="24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>;
    const Search = () => <svg width="24" height="24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>;
    const DollarSign = () => <svg width="24" height="24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><line x1="12" y1="1" x2="12" y2="23"/><path d="M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"/></svg>;
    const Download = () => <svg width="24" height="24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>;

    function CustomerServicesApp() {
      const [customers, setCustomers] = useState([]);
      const [selectedCustomer, setSelectedCustomer] = useState(null);
      const [isAddingCustomer, setIsAddingCustomer] = useState(false);
      const [isEditingCustomer, setIsEditingCustomer] = useState(false);
      const [searchTerm, setSearchTerm] = useState('');
      const [serviceFilter, setServiceFilter] = useState('');
      const [isLoading, setIsLoading] = useState(true);
      const [pdfLoading, setPdfLoading] = useState(false);
      
      const [customerForm, setCustomerForm] = useState({
        name: '', email: '', phone: '', address: '', city: '', state: '', zip: ''
      });

      const serviceOptions = [
        'Real Estate Photography', 'Real Estate Videography', 'Property Inspection',
        'Roof Inspection', 'Thermal Inspection', 'Search & Rescue', 'Deer Recovery',
        'Wildlife Survey', 'Pet Recovery', 'Agricultural Survey', 'Construction Documentation', 'Other'
      ];

      useEffect(() => {
        const loadCustomers = async () => {
          try {
            const result = await window.storage.get('hatfield-customers');
            if (result && result.value) {
              setCustomers(JSON.parse(result.value));
            }
          } catch (error) {
            console.log('No existing data');
          }
          setIsLoading(false);
        };
        loadCustomers();
        
        // Show install prompt on iOS
        const isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent);
        const isStandalone = window.matchMedia('(display-mode: standalone)').matches;
        if (isIOS && !isStandalone) {
          setTimeout(() => {
            document.getElementById('install-prompt').style.display = 'block';
          }, 2000);
        }
      }, []);

      useEffect(() => {
        if (!isLoading && customers.length >= 0) {
          const saveCustomers = async () => {
            try {
              await window.storage.set('hatfield-customers', JSON.stringify(customers));
            } catch (error) {
              console.error('Error saving:', error);
            }
          };
          saveCustomers();
        }
      }, [customers, isLoading]);

      const calculateSubtotal = () => {
        if (!selectedCustomer) return 0;
        return selectedCustomer.services.reduce((sum, s) => sum + (s.total || 0), 0);
      };

      const calculateTax = () => calculateSubtotal() * 0.06;
      const calculateTotal = () => calculateSubtotal() + calculateTax();

      const resetCustomerForm = () => {
        setCustomerForm({ name: '', email: '', phone: '', address: '', city: '', state: '', zip: '' });
      };

      const handleAddCustomer = () => {
        if (!customerForm.name.trim()) return;
        const newCustomer = {
          id: Date.now(),
          createdAt: Date.now(),
          ...customerForm,
          services: []
        };
        setCustomers([...customers, newCustomer]);
        resetCustomerForm();
        setIsAddingCustomer(false);
        setSelectedCustomer(newCustomer);
      };

      const handleUpdateCustomer = () => {
        if (!customerForm.name.trim()) return;
        setCustomers(customers.map(c => c.id === selectedCustomer.id ? { ...c, ...customerForm } : c));
        setSelectedCustomer({ ...selectedCustomer, ...customerForm });
        setIsEditingCustomer(false);
      };

      const handleDeleteCustomer = (id) => {
        if (confirm('Delete this customer?')) {
          setCustomers(customers.filter(c => c.id !== id));
          if (selectedCustomer?.id === id) setSelectedCustomer(null);
        }
      };

      const handleEditCustomer = () => {
        setCustomerForm({
          name: selectedCustomer.name, email: selectedCustomer.email, phone: selectedCustomer.phone,
          address: selectedCustomer.address, city: selectedCustomer.city, state: selectedCustomer.state, zip: selectedCustomer.zip
        });
        setIsEditingCustomer(true);
      };

      const handleAddService = () => {
        const newService = { id: Date.now(), service: serviceOptions[0], description: '', quantity: 1, rate: '', total: 0 };
        const updatedCustomer = { ...selectedCustomer, services: [...selectedCustomer.services, newService] };
        setCustomers(customers.map(c => c.id === selectedCustomer.id ? updatedCustomer : c));
        setSelectedCustomer(updatedCustomer);
      };

      const handleUpdateService = (serviceId, field, value) => {
        const updatedServices = selectedCustomer.services.map(s => {
          if (s.id === serviceId) {
            const updated = { ...s, [field]: value };
            if (field === 'quantity' || field === 'rate') {
              const qty = field === 'quantity' ? parseFloat(value) || 0 : s.quantity;
              const rate = field === 'rate' ? parseFloat(value) || 0 : parseFloat(s.rate) || 0;
              updated.total = qty * rate;
            }
            return updated;
          }
          return s;
        });
        const updatedCustomer = { ...selectedCustomer, services: updatedServices };
        setCustomers(customers.map(c => c.id === selectedCustomer.id ? updatedCustomer : c));
        setSelectedCustomer(updatedCustomer);
      };

      const handleDeleteService = (serviceId) => {
        const updatedCustomer = { ...selectedCustomer, services: selectedCustomer.services.filter(s => s.id !== serviceId) };
        setCustomers(customers.map(c => c.id === selectedCustomer.id ? updatedCustomer : c));
        setSelectedCustomer(updatedCustomer);
      };

      const handleEmailReceipt = () => {
        if (!selectedCustomer || selectedCustomer.services.length === 0) {
          alert('Please add services first.');
          return;
        }
        
        const subject = `Receipt from Hatfield Drone Services`;
        const body = `HATFIELD DRONE SERVICES
Service Receipt

Date: ${new Date().toLocaleDateString('en-US', { year: 'numeric', month: 'long', day: 'numeric' })}

BILL TO:
${selectedCustomer.name}
${selectedCustomer.email || ''}
${selectedCustomer.phone || ''}
${selectedCustomer.address || ''}
${[selectedCustomer.city, selectedCustomer.state, selectedCustomer.zip].filter(Boolean).join(', ')}

SERVICES:
${selectedCustomer.services.map(s => 
  `${s.service} - ${s.description}\nQty: ${s.quantity} x $${parseFloat(s.rate || 0).toFixed(2)} = $${parseFloat(s.total || 0).toFixed(2)}`
).join('\n\n')}

Subtotal: $${calculateSubtotal().toFixed(2)}
Tax (6%): $${calculateTax().toFixed(2)}
TOTAL: $${calculateTotal().toFixed(2)}

Thank you for your business!
`;
        
        window.location.href = `mailto:?subject=${encodeURIComponent(subject)}&body=${encodeURIComponent(body)}`;
      };

      const filteredCustomers = customers
        .filter(c => {
          const matchesSearch = !searchTerm || 
            (c.name && c.name.toLowerCase().includes(searchTerm.toLowerCase())) ||
            (c.email && c.email.toLowerCase().includes(searchTerm.toLowerCase())) ||
            (c.phone && c.phone.includes(searchTerm));
          const matchesService = !serviceFilter || (c.services && c.services.some(s => s.service === serviceFilter));
          return matchesSearch && matchesService;
        })
        .sort((a, b) => (b.createdAt || 0) - (a.createdAt || 0));

      return (
        <div className="min-h-screen bg-gradient-to-br from-blue-50 to-indigo-50 p-4">
          <div className="max-w-7xl mx-auto">
            <div className="bg-white rounded-lg shadow-lg overflow-hidden">
              <div className="bg-gradient-to-r from-blue-600 to-indigo-600 p-6 text-white">
                <h1 className="text-3xl font-bold">Hatfield Drone Services</h1>
                <p className="text-blue-100 mt-1">Customer & Services Manager</p>
              </div>

              {isLoading ? (
                <div className="flex items-center justify-center p-12">
                  <div className="text-center">
                    <div className="animate-spin rounded-full h-12 w-12 border-b-2 border-blue-600 mx-auto mb-4"></div>
                    <p className="text-gray-600">Loading your data...</p>
                  </div>
                </div>
              ) : (
                <div className="p-6">
                  <div className="mb-6 flex flex-col gap-3">
                    <div className="flex flex-col sm:flex-row gap-3">
                      <div className="flex-1">
                        <div className="relative mb-2">
                          <Search />
                          <input
                            type="text"
                            placeholder="Search customers..."
                            value={searchTerm}
                            onChange={(e) => setSearchTerm(e.target.value)}
                            className="w-full pl-10 pr-4 py-3 border-2 border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent text-base"
                          />
                        </div>
                        {searchTerm && <div className="text-sm text-gray-600 mb-2">Found {filteredCustomers.length} customer(s)</div>}
                        <select
                          value={selectedCustomer?.id || ''}
                          onChange={(e) => {
                            const customer = customers.find(c => c.id === parseInt(e.target.value));
                            setSelectedCustomer(customer);
                            setIsAddingCustomer(false);
                            setIsEditingCustomer(false);
                          }}
                          className="w-full px-4 py-3 border-2 border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent text-lg"
                        >
                          <option value="">Select a customer...</option>
                          {filteredCustomers.map(customer => (
                            <option key={customer.id} value={customer.id}>
                              {customer.name} {customer.email ? `(${customer.email})` : ''}
                            </option>
                          ))}
                        </select>
                      </div>
                      <button
                        onClick={() => {
                          resetCustomerForm();
                          setIsAddingCustomer(true);
                          setIsEditingCustomer(false);
                          setSelectedCustomer(null);
                        }}
                        className="bg-blue-600 text-white px-6 py-3 rounded-lg hover:bg-blue-700 transition flex items-center justify-center gap-2 font-semibold whitespace-nowrap"
                      >
                        <Plus />
                        Add New Customer
                      </button>
                    </div>
                  </div>

                  <div>
                    {isAddingCustomer || isEditingCustomer ? (
                      <div>
                        <div className="flex justify-between items-center mb-6">
                          <h2 className="text-2xl font-bold text-gray-900">
                            {isAddingCustomer ? 'Add New Customer' : 'Edit Customer'}
                          </h2>
                          <div className="flex gap-2">
                            {isEditingCustomer && (
                              <button onClick={() => { if (confirm(`Delete ${selectedCustomer.name}?`)) handleDeleteCustomer(selectedCustomer.id); }} className="text-red-600 hover:text-red-700 hover:bg-red-50 px-3 py-2 rounded-lg transition">
                                <Trash2 />
                              </button>
                            )}
                            <button onClick={() => { setIsAddingCustomer(false); setIsEditingCustomer(false); resetCustomerForm(); }} className="text-gray-500 hover:text-gray-700">
                              <X />
                            </button>
                          </div>
                        </div>

                        <div className="space-y-4">
                          <div>
                            <label className="block text-sm font-medium text-gray-700 mb-1">Customer Name *</label>
                            <input type="text" value={customerForm.name} onChange={(e) => setCustomerForm({ ...customerForm, name: e.target.value })} className="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent" placeholder="John Doe" />
                          </div>

                          <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                            <div>
                              <label className="block text-sm font-medium text-gray-700 mb-1">Email</label>
                              <input type="email" value={customerForm.email} onChange={(e) => setCustomerForm({ ...customerForm, email: e.target.value })} className="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent" placeholder="john@example.com" />
                            </div>
                            <div>
                              <label className="block text-sm font-medium text-gray-700 mb-1">Phone</label>
                              <input type="tel" value={customerForm.phone} onChange={(e) => setCustomerForm({ ...customerForm, phone: e.target.value })} className="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent" placeholder="(555) 123-4567" />
                            </div>
                          </div>

                          <div>
                            <label className="block text-sm font-medium text-gray-700 mb-1">Street Address</label>
                            <input type="text" value={customerForm.address} onChange={(e) => setCustomerForm({ ...customerForm, address: e.target.value })} className="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent" placeholder="123 Main Street" />
                          </div>

                          <div className="grid grid-cols-2 md:grid-cols-3 gap-4">
                            <div className="col-span-2 md:col-span-1">
                              <label className="block text-sm font-medium text-gray-700 mb-1">City</label>
                              <input type="text" value={customerForm.city} onChange={(e) => setCustomerForm({ ...customerForm, city: e.target.value })} className="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent" placeholder="Winston-Salem" />
                            </div>
                            <div>
                              <label className="block text-sm font-medium text-gray-700 mb-1">State</label>
                              <input type="text" value={customerForm.state} onChange={(e) => setCustomerForm({ ...customerForm, state: e.target.value })} className="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent" placeholder="NC" maxLength="2" />
                            </div>
                            <div>
                              <label className="block text-sm font-medium text-gray-700 mb-1">ZIP</label>
                              <input type="text" value={customerForm.zip} onChange={(e) => setCustomerForm({ ...customerForm, zip: e.target.value })} className="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent" placeholder="27101" />
                            </div>
                          </div>

                          <div className="flex gap-3 pt-4">
                            <button onClick={isAddingCustomer ? handleAddCustomer : handleUpdateCustomer} className="flex-1 bg-blue-600 text-white px-6 py-3 rounded-lg hover:bg-blue-700 transition flex items-center justify-center gap-2">
                              <Save />
                              {isAddingCustomer ? 'Add Customer' : 'Save Changes'}
                            </button>
                            <button onClick={() => { setIsAddingCustomer(false); setIsEditingCustomer(false); resetCustomerForm(); }} className="px-6 py-3 border border-gray-300 rounded-lg hover:bg-gray-50 transition">
                              Cancel
                            </button>
                          </div>
                        </div>
                      </div>
                    ) : selectedCustomer ? (
                      <div>
                        <div className="mb-6 p-4 bg-gray-50 rounded-lg border border-gray-200">
                          <div className="flex justify-between items-start mb-3">
                            <div>
                              <h2 className="text-2xl font-bold text-gray-900">{selectedCustomer.name}</h2>
                              <p className="text-gray-600">{selectedCustomer.email}</p>
                              <p className="text-gray-600">{selectedCustomer.phone}</p>
                            </div>
                            <button onClick={handleEditCustomer} className="text-blue-600 hover:text-blue-700 flex items-center gap-1">
                              <Edit2 />
                              Edit
                            </button>
                          </div>
                          {selectedCustomer.address && (
                            <div className="text-sm text-gray-600">
                              <p>{selectedCustomer.address}</p>
                              <p>{selectedCustomer.city}{selectedCustomer.state && `, ${selectedCustomer.state}`}{selectedCustomer.zip && ` ${selectedCustomer.zip}`}</p>
                            </div>
                          )}
                        </div>

                        <div className="flex justify-between items-center mb-4">
                          <h3 className="text-xl font-bold text-gray-900">Services</h3>
                          <button onClick={handleAddService} className="bg-green-600 text-white px-4 py-2 rounded-lg hover:bg-green-700 transition flex items-center gap-2">
                            <Plus />
                            Add Service
                          </button>
                        </div>

                        {selectedCustomer.services.length === 0 ? (
                          <div className="text-center py-12 text-gray-500">
                            No services added yet. Click "Add Service" to get started.
                          </div>
                        ) : (
                          <div className="space-y-4">
                            {selectedCustomer.services.map(service => (
                              <div key={service.id} className="border border-gray-300 rounded-lg p-4 bg-white hover:shadow-md transition">
                                <div className="grid grid-cols-1 md:grid-cols-12 gap-4">
                                  <div className="md:col-span-3">
                                    <label className="block text-xs font-medium text-gray-700 mb-1">Service Type</label>
                                    <select value={service.service} onChange={(e) => handleUpdateService(service.id, 'service', e.target.value)} className="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent">
                                      {serviceOptions.map(option => <option key={option} value={option}>{option}</option>)}
                                    </select>
                                  </div>
                                  <div className="md:col-span-4">
                                    <label className="block text-xs font-medium text-gray-700 mb-1">Description</label>
                                    <input type="text" value={service.description} onChange={(e) => handleUpdateService(service.id, 'description', e.target.value)} className="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent" placeholder="Additional details..." />
                                  </div>
                                  <div className="md:col-span-1">
                                    <label className="block text-xs font-medium text-gray-700 mb-1">Qty</label>
                                    <input type="number" value={service.quantity} onChange={(e) => handleUpdateService(service.id, 'quantity', e.target.value)} className="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent" min="0" step="0.1" />
                                  </div>
                                  <div className="md:col-span-2">
                                    <label className="block text-xs font-medium text-gray-700 mb-1">Rate ($)</label>
                                    <input type="number" value={service.rate} onChange={(e) => handleUpdateService(service.id, 'rate', e.target.value)} className="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent" placeholder="0.00" min="0" step="0.01" />
                                  </div>
                                  <div className="md:col-span-1">
                                    <label className="block text-xs font-medium text-gray-700 mb-1">Total</label>
                                    <div className="flex items-center h-10 px-3 py-2 bg-gray-50 border border-gray-300 rounded-lg font-semibold text-gray-900">
                                      ${service.total.toFixed(2)}
                                    </div>
                                  </div>
                                  <div className="md:col-span-1 flex items-end">
                                    <button onClick={() => handleDeleteService(service.id)} className="w-full text-red-500 hover:text-red-700 hover:bg-red-50 p-2 rounded-lg transition">
                                      <Trash2 />
                                    </button>
                                  </div>
                                </div>
                              </div>
                            ))}

                            <div className="mt-6 pt-4 border-t-2 border-gray-300">
                              <div className="space-y-2">
                                <div className="flex justify-end items-center gap-4">
                                  <span className="text-lg font-medium text-gray-700">Subtotal:</span>
                                  <div className="text-xl font-semibold text-gray-900 w-32 text-right">${calculateSubtotal().toFixed(2)}</div>
                                </div>
                                <div className="flex justify-end items-center gap-4">
                                  <span className="text-lg font-medium text-gray-700">Tax (6%):</span>
                                  <div className="text-xl font-semibold text-gray-900 w-32 text-right">${calculateTax().toFixed(2)}</div>
                                </div>
                                <div className="flex justify-end items-center gap-4 pt-2 border-t border-gray-300">
                                  <span className="text-xl font-bold text-gray-900">Total:</span>
                                  <div className="flex items-center gap-2 text-3xl font-bold text-green-600 w-32 justify-end">
                                    <DollarSign />
                                    {calculateTotal().toFixed(2)}
                                  </div>
                                </div>
                              </div>
                            </div>

                            <div className="mt-6 flex flex-col sm:flex-row gap-3">
                              <button onClick={() => setSelectedCustomer(null)} className="flex-1 bg-blue-600 text-white px-6 py-3 rounded-lg hover:bg-blue-700 transition flex items-center justify-center gap-2 font-semibold">
                                <Save />
                                Save & Exit
                              </button>
                              <button onClick={handleEmailReceipt} className="flex-1 bg-green-600 text-white px-6 py-3 rounded-lg hover:bg-green-700 transition flex items-center justify-center gap-2 font-semibold">
                                <Download />
                                Email Receipt
                              </button>
                            </div>
                          </div>
                        )}
                      </div>
                    ) : (
                      <div className="flex items-center justify-center h-full text-gray-500">
                        <div className="text-center">
                          <p className="text-xl mb-2">Select a customer or add a new one to get started</p>
                          <p className="text-sm">Manage your customers and their service orders all in one place</p>
                        </div>
                      </div>
                    )}
                  </div>
                </div>
              )}
            </div>
          </div>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<CustomerServicesApp />);
  </script>
</body>
</html>
